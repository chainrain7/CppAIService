<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CppAI · 工作台</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
    .shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 0 24px 60px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* 顶栏 */
    .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 0;
        animation: fadeIn 0.4s ease;
    }
    .topnav .brand { font-size: 17px; }
    .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
    }
    .user-chip .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
    }

    /* 主区域 */
    .hero { margin: 44px 0 36px; animation: fadeUp 0.5s ease; }
    .hero h1 {
        margin: 0 0 10px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .hero h1 em {
        font-style: normal;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .hero p { margin: 0; color: var(--muted); font-size: 15px; }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        animation: fadeUp 0.6s ease;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

    .service-card {
        position: relative;
        padding: 26px 26px 22px;
        border-radius: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: transform 0.22s, border-color 0.22s, background 0.22s, box-shadow 0.22s;
        overflow: hidden;
    }
    .service-card:hover {
        transform: translateY(-3px);
        border-color: rgba(109, 124, 255, 0.55);
        background: var(--panel-hover);
        box-shadow: 0 14px 40px rgba(109, 124, 255, 0.16);
    }
    .service-card::after {
        content: "→";
        position: absolute;
        right: 22px; top: 24px;
        color: var(--muted-2);
        font-size: 18px;
        transition: transform 0.22s, color 0.22s;
    }
    .service-card:hover::after { transform: translateX(4px); color: var(--acc-2); }

    .svc-icon {
        width: 46px; height: 46px;
        border-radius: 13px;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
        margin-bottom: 16px;
        color: #fff;
    }
    .svc-icon.chat { background: var(--grad); box-shadow: 0 6px 18px rgba(109, 124, 255, 0.35); }
    .svc-icon.vision { background: linear-gradient(135deg, #22d3ee, #34d399); box-shadow: 0 6px 18px rgba(34, 211, 238, 0.3); }

    .service-card h3 { margin: 0 0 8px; font-size: 17px; font-weight: 650; }
    .service-card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }

    .svc-tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
    .svc-tags span {
        font-size: 11.5px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
    }

    .foot {
        margin-top: auto;
        padding-top: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted-2);
        font-size: 12.5px;
        animation: fadeIn 0.8s ease;
    }
</style>
</head>
<body>
<div class="shell">
    <nav class="topnav">
        <span class="brand"><span class="brand-mark">◈</span>CppAI</span>
        <span class="user-chip">
            <span class="dot"></span>在线
            <button class="btn-danger-ghost" id="logout-btn">退出登录</button>
        </span>
    </nav>

    <div class="hero">
        <h1>欢迎回来，<em>开始与 AI 对话</em></h1>
        <p>多模型对话 · 知识库问答 · 工具调用 · 语音合成，全部跑在你自己的 C++ 服务上。</p>
    </div>

    <div class="grid">
        <div class="service-card" id="chat-service">
            <div class="svc-icon chat">✦</div>
            <h3>AI 聊天助手</h3>
            <p>与通义千问 / DeepSeek 对话，支持 RAG 知识库问答与 MCP 工具调用，多会话管理与语音合成。</p>
            <div class="svc-tags"><span>多模型</span><span>RAG</span><span>MCP 工具</span><span>TTS</span></div>
        </div>
        <div class="service-card" id="image-service">
            <div class="svc-icon vision">◎</div>
            <h3>图像识别</h3>
            <p>上传图片，ONNX Runtime 本地推理完成分类识别，不依赖云端视觉 API。</p>
            <div class="svc-tags"><span>ONNX</span><span>本地推理</span><span>OpenCV</span></div>
        </div>
    </div>

    <div class="foot">
        <span>CppAI Service · C++17 · muduo</span>
        <span>GPL-3.0</span>
    </div>
</div>

<script src="/assets/app.js"></script>
<script>
    // 站内导航标志：beforeunload 里据此跳过自动登出（否则点卡片进服务
    // 就会被当作"页面关闭"登出会话，下一个页面立刻 401）
    let internalNav = false;

    // 进入服务（标准导航，浏览器历史/回退自然）
    function loadService(path) {
        internalNav = true;
        window.location.href = path;
    }

    document.getElementById('chat-service').addEventListener('click', () => loadService('/chat'));
    document.getElementById('image-service').addEventListener('click', () => loadService('/upload'));

    document.getElementById('logout-btn').addEventListener('click', () => {
        const userId = sessionStorage.getItem('userId');
        fetch('/user/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: userId, type: 'manual', gameType: 0 })
        })
            .then(() => { sessionStorage.clear(); window.location.href = '/entry'; })
            .catch(() => cppaiToast('退出登录失败', 'err'));
    });

    // 仅在真正的刷新/关闭时自动登出（sendBeacon 不阻塞卸载）；站内导航跳过
    window.addEventListener('beforeunload', function () {
        if (internalNav) return;
        const userId = sessionStorage.getItem('userId');
        if (userId) {
            const data = new Blob([JSON.stringify({ userId: userId, type: 'refresh', gameType: 0 })],
                { type: 'application/json' });
            navigator.sendBeacon('/user/logout', data);
        }
    });

    // 未登录跳转
    window.addEventListener('load', function () {
        const userId = sessionStorage.getItem('userId');
        if (!userId) window.location.href = '/entry';
    });
</script>
</body>
</html>
