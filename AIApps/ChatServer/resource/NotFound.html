<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · CppAI</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    .wrap { text-align: center; animation: fadeUp 0.5s ease; }
    .code {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #6d7cff, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 4px;
    }
    .wrap h2 { margin: 14px 0 8px; font-size: 18px; font-weight: 600; }
    .wrap p { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h2>页面不存在</h2>
        <p>你访问的地址没有对应的服务</p>
        <a href="/menu" class="btn">返回工作台</a>
    </div>
</body>
</html>
