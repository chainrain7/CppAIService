<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CppAI · 图像识别</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .top-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--border);
        background: rgba(11, 14, 20, 0.7);
        backdrop-filter: blur(10px);
    }
    .top-bar .title { font-size: 14.5px; font-weight: 600; margin-right: auto; }
    .top-bar a { font-size: 13px; color: var(--muted); cursor: pointer; }
    .top-bar a:hover { color: var(--acc-2); }

    .stage {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        gap: 22px;
    }

    /* 拖拽上传区 */
    .dropzone {
        width: min(520px, 92vw);
        padding: 46px 30px;
        border: 1.5px dashed var(--border-strong);
        border-radius: 18px;
        background: var(--panel);
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .dropzone:hover, .dropzone.drag {
        border-color: var(--acc-1);
        background: rgba(109, 124, 255, 0.08);
        transform: translateY(-2px);
    }
    .dropzone .dz-icon {
        font-size: 38px;
        margin-bottom: 14px;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
    }
    .dropzone h3 { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
    .dropzone p { margin: 0; color: var(--muted); font-size: 13px; }
    .dropzone input[type="file"] { display: none; }

    /* 预览 + 结果 */
    .work-panel {
        width: min(520px, 92vw);
        display: none;
        animation: fadeUp 0.35s ease;
    }
    .preview-card {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--panel);
    }
    .preview-card img { width: 100%; max-height: 320px; object-fit: contain; display: block; background: #0d1017; }
    .preview-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        font-size: 13px;
        color: var(--muted);
        border-top: 1px solid var(--border);
    }
    .preview-meta .name { max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .result-card {
        margin-top: 16px;
        padding: 18px 20px;
        border-radius: 16px;
        border: 1px solid rgba(52, 211, 153, 0.35);
        background: rgba(52, 211, 153, 0.07);
        display: none;
        animation: fadeUp 0.35s ease;
    }
    .result-card.pending { display: block; border-color: var(--border); background: var(--panel); }
    .result-card.ok { display: block; }
    .result-card.err { display: block; border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.07); }

    .result-label { font-size: 12.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .result-value { font-size: 19px; font-weight: 700; }
    .result-card.ok .result-value { color: var(--ok); }
    .result-card.err .result-value { color: var(--danger); font-size: 15px; font-weight: 550; }

    .confidence { margin-top: 14px; }
    .confidence .bar {
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
    }
    .confidence .fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #34d399, #22d3ee);
        transition: width 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .confidence .pct { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
</style>
</head>
<body>
    <div class="top-bar">
        <span class="brand"><span class="brand-mark">◎</span>CppAI</span>
        <span class="title">图像识别</span>
        <a href="/menu">← 返回工作台</a>
    </div>

    <div class="stage">
        <div class="dropzone" id="dropzone">
            <div class="dz-icon">◎</div>
            <h3>拖拽图片到此处，或点击选择</h3>
            <p>ONNX Runtime 本地推理 · 支持 PNG / JPG / WebP</p>
            <form id="upload-form">
                <input type="file" id="image-input" accept="image/*" required>
            </form>
        </div>

        <div class="work-panel" id="work-panel">
            <div class="preview-card">
                <img id="preview-img" alt="预览">
                <div class="preview-meta">
                    <span class="name" id="file-name">—</span>
                    <span id="file-size">—</span>
                </div>
            </div>
            <div class="result-card" id="result-card">
                <div class="result-label" id="result-label">识别结果</div>
                <div class="result-value" id="result-value">—</div>
                <div class="confidence" id="confidence" style="display:none">
                    <div class="bar"><div class="fill" id="conf-fill"></div></div>
                    <div class="pct" id="conf-pct"></div>
                </div>
            </div>
            <div class="actions">
                <button class="btn-ghost" id="rechoose-btn">重新选择图片</button>
            </div>
        </div>
    </div>

    <script src="/assets/app.js"></script>
    <script>
        const dropzone = document.getElementById('dropzone');
        const imageInput = document.getElementById('image-input');
        const workPanel = document.getElementById('work-panel');
        const resultCard = document.getElementById('result-card');

        function humanSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        function resetResult() {
            resultCard.className = 'result-card';
            resultCard.style.display = 'none';
            document.getElementById('confidence').style.display = 'none';
        }

        function showPending() {
            resultCard.className = 'result-card pending';
            resultCard.style.display = 'block';
            document.getElementById('result-label').textContent = '状态';
            document.getElementById('result-value').innerHTML = '<span class="spinner"></span>&nbsp; 本地推理中…';
        }

        async function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                cppaiToast('请选择图片文件', 'err');
                return;
            }

            document.getElementById('preview-img').src = URL.createObjectURL(file);
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = humanSize(file.size);
            dropzone.style.display = 'none';
            workPanel.style.display = 'block';
            resetResult();
            showPending();

            const reader = new FileReader();
            reader.onload = async function (event) {
                const base64Url = event.target.result;
                const base64Data = base64Url.split(',')[1];

                try {
                    const response = await fetch('/upload/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, image: base64Data })
                    });
                    const data = await response.json();

                    if (!response.ok || data.status === 'error') {
                        throw new Error(data.message || '识别失败');
                    }

                    const conf = Math.round((data.confidence || 0) * 100);
                    resultCard.className = 'result-card ok';
                    document.getElementById('result-label').textContent = '识别结果';
                    document.getElementById('result-value').textContent = data.class_name;
                    document.getElementById('confidence').style.display = '';
                    document.getElementById('conf-pct').textContent = '置信度 ' + conf + '%';
                    setTimeout(() => { document.getElementById('conf-fill').style.width = conf + '%'; }, 60);
                } catch (err) {
                    resultCard.className = 'result-card err';
                    document.getElementById('result-label').textContent = '识别失败';
                    document.getElementById('result-value').textContent = err.message;
                }
            };
            reader.readAsDataURL(file);
        }

        dropzone.addEventListener('click', () => imageInput.click());
        document.getElementById('rechoose-btn').addEventListener('click', () => {
            imageInput.click();
        });
        imageInput.addEventListener('change', () => {
            if (imageInput.files.length) handleFile(imageInput.files[0]);
        });

        ['dragenter', 'dragover'].forEach(ev =>
            dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
        ['dragleave', 'drop'].forEach(ev =>
            dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
        dropzone.addEventListener('drop', e => {
            const file = e.dataTransfer.files && e.dataTransfer.files[0];
            if (file) handleFile(file);
        });
    </script>
</body>
</html>
