<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CppAI · 登录</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }

    .auth-wrap { width: 400px; max-width: 100%; animation: fadeUp 0.5s ease; }

    .auth-brand { justify-content: center; display: flex; font-size: 20px; margin-bottom: 8px; }
    .auth-sub {
        text-align: center; color: var(--muted); font-size: 13px;
        margin: 0 0 28px; letter-spacing: 1px;
    }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 30px 32px 26px;
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow-2);
    }

    /* 登录/注册切换 */
    .tabs {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: rgba(255, 255, 255, 0.05);
        border-radius: var(--radius-sm);
        padding: 4px;
        margin-bottom: 24px;
    }
    .tabs-indicator {
        position: absolute;
        top: 4px; left: 4px;
        width: calc(50% - 4px);
        height: calc(100% - 8px);
        background: var(--grad);
        border-radius: 7px;
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 3px 12px rgba(109, 124, 255, 0.4);
    }
    .tabs.reg .tabs-indicator { transform: translateX(100%); }
    .tabs button {
        position: relative;
        z-index: 1;
        padding: 9px 0;
        border: none;
        background: none;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        font-family: var(--font);
        cursor: pointer;
        transition: color 0.2s;
    }
    .tabs.reg button:first-child, .tabs:not(.reg) button:last-child { color: var(--muted); }
    .tabs:not(.reg) button:first-child, .tabs.reg button:last-child { color: #fff; }

    .btn { width: 100%; padding: 12px; font-size: 15px; margin-top: 6px; }
    .btn .spinner { display: none; }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-label { opacity: 0.7; }

    .switch-hint {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted);
    }
    .switch-hint a { cursor: pointer; font-weight: 600; }

    .footer-note {
        text-align: center;
        margin-top: 26px;
        font-size: 12px;
        color: var(--muted-2);
        letter-spacing: 0.5px;
    }
</style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-brand">
        <span class="brand"><span class="brand-mark">◈</span>CppAI</span>
    </div>
    <p class="auth-sub">C++ AI 应用服务平台</p>

    <div class="card">
        <div class="tabs" id="tabs">
            <div class="tabs-indicator"></div>
            <button type="button" id="tab-login">登 录</button>
            <button type="button" id="tab-register">注 册</button>
        </div>

        <!-- 登录 -->
        <form id="login-form">
            <div class="field">
                <label for="login-username">用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn" id="login-btn">
                <span class="spinner"></span><span class="btn-label">进入平台</span>
            </button>
        </form>

        <!-- 注册 -->
        <form id="register-form" style="display:none">
            <div class="field">
                <label for="register-username">用户名</label>
                <input type="text" id="register-username" placeholder="设置用户名" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="register-password">密码</label>
                <input type="password" id="register-password" placeholder="设置密码" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn" id="register-btn">
                <span class="spinner"></span><span class="btn-label">创建账号</span>
            </button>
        </form>

        <div class="switch-hint" id="switch-hint">
            还没有账号？<a id="switch-to-register">立即注册</a>
        </div>
    </div>

    <div class="footer-note">Self-hosted · C++17 · muduo</div>
</div>

<script src="/assets/app.js"></script>
<script>
const tabs = document.getElementById('tabs');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const hint = document.getElementById('switch-hint');

function showLogin() {
    tabs.classList.remove('reg');
    loginForm.style.display = '';
    registerForm.style.display = 'none';
    hint.innerHTML = '还没有账号？<a id="switch-to-register">立即注册</a>';
    bindSwitch();
}
function showRegister() {
    tabs.classList.add('reg');
    registerForm.style.display = '';
    loginForm.style.display = 'none';
    hint.innerHTML = '已有账号？<a id="switch-to-login">返回登录</a>';
    bindSwitch();
}
function bindSwitch() {
    const toReg = document.getElementById('switch-to-register');
    const toLogin = document.getElementById('switch-to-login');
    if (toReg) toReg.onclick = showRegister;
    if (toLogin) toLogin.onclick = showLogin;
}
document.getElementById('tab-login').onclick = showLogin;
document.getElementById('tab-register').onclick = showRegister;
bindSwitch();

function setLoading(btn, on) {
    btn.classList.toggle('loading', on);
    btn.disabled = on;
}

// 登录
loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    setLoading(btn, true);

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    }).then(response => {
        if (response.status === 403) { throw Object.assign(new Error('已在别处登录'), { handled: true }); }
        const contentType = response.headers.get('content-type');
        if (response.status === 200) {
            if (contentType && contentType.includes('application/json')) return response.json();
            throw Object.assign(new Error('返回格式错误'), { handled: true });
        } else if (response.status === 401) {
            throw Object.assign(new Error('账号或密码错误'), { handled: true });
        }
        throw new Error('请求失败');
    }).then(data => {
        if (data && data.userId) {
            sessionStorage.setItem('userId', data.userId);
            cppaiToast('登录成功，正在进入…', 'ok');
            setTimeout(() => { window.location.href = '/menu'; }, 400);
        } else {
            throw new Error('无效的响应数据');
        }
    }).catch(error => {
        console.error('Error:', error);
        setLoading(btn, false);
        if (error.handled) cppaiToast(error.message, 'err');
        else cppaiToast('操作失败，请重试', 'err');
    });
});

// 注册
registerForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const username = document.getElementById('register-username').value;
    const password = document.getElementById('register-password').value;
    setLoading(btn, true);

    fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    }).then(response => {
        setLoading(btn, false);
        if (response.status === 200) {
            cppaiToast('注册成功，请登录', 'ok');
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = password;
            setTimeout(showLogin, 600);
        } else if (response.status === 409) {
            cppaiToast('用户名已被注册', 'err');
        } else {
            cppaiToast('注册失败，请重试', 'err');
        }
    }).catch(error => {
        console.error('注册错误:', error);
        setLoading(btn, false);
        cppaiToast('注册失败，请检查网络', 'err');
    });
});
</script>
</body>
</html>
