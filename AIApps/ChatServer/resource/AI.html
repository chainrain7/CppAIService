<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CppAI · 聊天</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
    body { display: flex; height: 100vh; overflow: hidden; }

    /* ============ 左侧会话栏 ============ */
    .session-list {
        width: 252px;
        flex: none;
        display: flex;
        flex-direction: column;
        background: rgba(13, 16, 24, 0.7);
        border-right: 1px solid var(--border);
        backdrop-filter: blur(10px);
    }
    .sl-head { padding: 18px 16px 12px; }
    .sl-head .brand { font-size: 15px; margin-bottom: 14px; }

    .new-chat-btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--grad);
        color: #fff;
        font-size: 13.5px;
        font-weight: 600;
        font-family: var(--font);
        cursor: pointer;
        transition: filter 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(109, 124, 255, 0.3);
    }
    .new-chat-btn:hover { filter: brightness(1.12); }

    .sl-title {
        font-size: 11.5px;
        color: var(--muted-2);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 14px 18px 8px;
    }
    .sl-items { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
    .session-item {
        position: relative;
        padding: 10px 12px;
        margin-bottom: 2px;
        border-radius: 9px;
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s, color 0.15s;
    }
    .session-item:hover { background: var(--panel-hover); color: var(--text); }
    .session-item.active {
        background: rgba(109, 124, 255, 0.14);
        color: var(--text);
        font-weight: 550;
    }
    .session-item.active::before {
        content: "";
        position: absolute;
        left: 0; top: 20%; bottom: 20%;
        width: 3px;
        border-radius: 3px;
        background: var(--grad);
    }
    .sl-foot {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
    }
    .sl-foot a {
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.2s;
    }
    .sl-foot a:hover { color: var(--acc-2); }

    /* ============ 右侧聊天区 ============ */
    .chat-section { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .top-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(11, 14, 20, 0.7);
        backdrop-filter: blur(10px);
    }
    .top-bar .title { font-size: 14.5px; font-weight: 600; margin-right: auto; }
    .model-select {
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        font-family: var(--font);
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
    }
    .model-select:hover, .model-select:focus { border-color: var(--border-strong); }
    .model-select option { background: #161a24; color: var(--text); }

    /* 消息区 */
    .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 26px 26px 14px;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .msg-row { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
        width: 32px; height: 32px;
        border-radius: 10px;
        flex: none;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
        color: #fff;
        margin-top: 2px;
    }
    .avatar.ai { background: var(--grad); box-shadow: 0 3px 10px rgba(109, 124, 255, 0.35); }
    .avatar.me { background: rgba(255, 255, 255, 0.12); border: 1px solid var(--border-strong); }

    .bubble-wrap { max-width: 72%; min-width: 0; }
    .msg-row.user .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }

    .bubble {
        position: relative;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 14.5px;
        line-height: 1.65;
        word-break: break-word;
    }
    .msg-row.user .bubble {
        background: var(--grad);
        color: #fff;
        border-top-right-radius: 5px;
        box-shadow: 0 4px 16px rgba(109, 124, 255, 0.25);
        white-space: pre-wrap;
    }
    .msg-row.assistant .bubble {
        background: var(--panel);
        border: 1px solid var(--border);
        border-top-left-radius: 5px;
    }
    .msg-row.assistant .bubble.err { border-color: rgba(248, 113, 113, 0.4); }

    /* Markdown 渲染样式 */
    .bubble :first-child { margin-top: 0; }
    .bubble :last-child { margin-bottom: 0; }
    .bubble p { margin: 8px 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 14px 0 8px; line-height: 1.4; }
    .bubble h1 { font-size: 18px; } .bubble h2 { font-size: 16px; } .bubble h3 { font-size: 15px; }
    .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
    .bubble li { margin: 4px 0; }
    .bubble code {
        font-family: var(--mono);
        font-size: 13px;
        background: rgba(255, 255, 255, 0.09);
        border-radius: 5px;
        padding: 2px 6px;
    }
    .msg-row.user .bubble code { background: rgba(0, 0, 0, 0.22); }
    .bubble pre {
        background: #0d1017;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px 15px;
        overflow-x: auto;
        margin: 10px 0;
    }
    .bubble pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
    .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
    .bubble th, .bubble td { border: 1px solid var(--border-strong); padding: 6px 12px; }
    .bubble th { background: rgba(255, 255, 255, 0.06); }
    .bubble blockquote {
        margin: 8px 0; padding: 4px 14px;
        border-left: 3px solid var(--acc-1);
        color: var(--muted);
        background: rgba(109, 124, 255, 0.06);
        border-radius: 0 8px 8px 0;
    }
    .bubble a { color: var(--acc-2); }
    .bubble img { max-width: 100%; border-radius: 8px; }

    /* 消息操作按钮（悬停出现） */
    .msg-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        opacity: 0;
        transition: opacity 0.18s;
    }
    .bubble-wrap:hover .msg-actions { opacity: 1; }
    .icon-btn {
        border: none;
        background: none;
        color: var(--muted-2);
        font-size: 12.5px;
        cursor: pointer;
        padding: 3px 8px;
        border-radius: 6px;
        font-family: var(--font);
        transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--panel-hover); color: var(--acc-2); }
    .icon-btn.playing { color: var(--acc-2); }

    /* 打字指示 */
    .typing { display: inline-flex; align-items: center; gap: 5px; padding: 4px 2px; }
    .typing i {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: bounce 1.2s infinite;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-5px); opacity: 1; }
    }

    /* 空状态 */
    .empty-state {
        margin: auto;
        text-align: center;
        color: var(--muted);
        animation: fadeIn 0.5s ease;
    }
    .empty-state .glyph {
        width: 64px; height: 64px;
        border-radius: 20px;
        background: var(--grad);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 30px; color: #fff;
        margin-bottom: 18px;
        box-shadow: 0 10px 30px rgba(109, 124, 255, 0.35);
    }
    .empty-state h2 { margin: 0 0 8px; font-size: 18px; color: var(--text); font-weight: 650; }
    .empty-state p { margin: 0; font-size: 13.5px; }

    /* 输入区 */
    .input-box {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 14px 18px 16px;
        border-top: 1px solid var(--border);
        background: rgba(11, 14, 20, 0.7);
        backdrop-filter: blur(10px);
    }
    .input-box textarea {
        flex: 1;
        resize: none;
        max-height: 160px;
        padding: 12px 15px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font-size: 14.5px;
        font-family: var(--font);
        line-height: 1.5;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box textarea:focus {
        border-color: var(--acc-1);
        box-shadow: 0 0 0 3px rgba(109, 124, 255, 0.15);
    }
    .send-btn {
        padding: 12px 22px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--grad);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: var(--font);
        cursor: pointer;
        transition: filter 0.2s;
        box-shadow: 0 4px 14px rgba(109, 124, 255, 0.3);
    }
    .send-btn:hover { filter: brightness(1.12); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 720px) {
        .session-list { display: none; }
        .bubble-wrap { max-width: 88%; }
    }
</style>

<script src="/assets/vendor/marked.min.js"></script>
<script src="/assets/vendor/purify.min.js"></script>
</head>
<body>
    <!-- 左侧会话列表 -->
    <aside class="session-list">
        <div class="sl-head">
            <span class="brand"><span class="brand-mark">◈</span>CppAI</span>
            <button class="new-chat-btn" id="newChatBtn">＋ 新对话</button>
        </div>
        <div class="sl-title">会话</div>
        <div class="sl-items" id="sessionList"></div>
        <div class="sl-foot"><a href="/menu">← 返回工作台</a></div>
    </aside>

    <!-- 右侧聊天区 -->
    <section class="chat-section">
        <div class="top-bar">
            <span class="title" id="chat-title">新对话</span>
            <select class="model-select" id="modelType" title="选择模型">
                <option value="1" selected>通义千问</option>
                <option value="2">DeepSeek</option>
                <option value="3">百炼 RAG</option>
                <option value="4">MCP 工具</option>
            </select>
            <button class="btn-ghost" id="sync-history-btn" title="从服务端重新拉取当前会话历史">
                ⟳ 同步历史
            </button>
        </div>

        <div class="chat-container" id="chat-container"></div>

        <form class="input-box" id="chat-form">
            <textarea id="question" placeholder="输入问题，Enter 发送，Shift + Enter 换行" rows="1" required></textarea>
            <button type="submit" class="send-btn" id="send-btn">发送</button>
        </form>
    </section>

    <script src="/assets/app.js"></script>
    <script>
        let currentSessionId = null, tempSession = false, sending = false;
        const sessions = {};
        const sessionList = document.getElementById('sessionList');
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const questionInput = document.getElementById('question');
        const syncBtn = document.getElementById('sync-history-btn');
        const modelTypeSelect = document.getElementById('modelType');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatTitle = document.getElementById('chat-title');
        const sendBtn = document.getElementById('send-btn');

        // ---------- TTS ----------
        async function playTTS(btn, text) {
            if (btn.classList.contains('playing')) return;
            btn.classList.add('playing');
            btn.textContent = '◉ 播放中';
            try {
                const res = await fetch('/chat/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
                const ct = res.headers.get('content-type') || '';
                if (res.ok && ct.startsWith('audio/')) {
                    // 主通道：DashScope 直接返回音频流
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.onended = () => { btn.classList.remove('playing'); btn.textContent = '▶ 朗读'; };
                    audio.play();
                    return;
                }
                const data = await res.json();
                if (data.success && data.url) {
                    const audio = new Audio(data.url);
                    audio.onended = () => { btn.classList.remove('playing'); btn.textContent = '▶ 朗读'; };
                    audio.play();
                    return;
                }
                cppaiToast(data.message || '无法获取语音', 'err');
            } catch (err) {
                console.error(err);
                cppaiToast('语音接口请求失败', 'err');
            }
            btn.classList.remove('playing');
            btn.textContent = '▶ 朗读';
        }

        // ---------- 消息渲染 ----------
        // Markdown 渲染降级：marked/DOMPurify 任一未就绪时退回纯文本，
        // 保证消息链路永远可用（渲染失败绝不能吞掉消息本身）
        function renderMarkdown(content) {
            try {
                if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                    return DOMPurify.sanitize(marked.parse(content));
                }
            } catch (e) { console.error('markdown render failed', e); }
            const div = document.createElement('div');
            div.textContent = content;
            return div.innerHTML;
        }

        function showEmptyState() {
            chatContainer.innerHTML =
                '<div class="empty-state">' +
                '<div class="glyph">✦</div>' +
                '<h2>开始一段新对话</h2>' +
                '<p>支持多模型切换、知识库问答与工具调用</p>' +
                '</div>';
        }

        function appendMessage(role, content) {
            if (chatContainer.querySelector('.empty-state')) chatContainer.innerHTML = '';
            const row = document.createElement('div');
            row.className = 'msg-row ' + role;

            const avatar = document.createElement('div');
            avatar.className = 'avatar ' + (role === 'user' ? 'me' : 'ai');
            avatar.textContent = role === 'user' ? '我' : '✦';

            const wrap = document.createElement('div');
            wrap.className = 'bubble-wrap';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'user') {
                bubble.textContent = content;
            } else {
                bubble.innerHTML = renderMarkdown(content);
                if (String(content).startsWith('[错误]')) bubble.classList.add('err');
            }

            wrap.appendChild(bubble);

            // AI 消息：悬停出现朗读按钮（内容存在闭包里，不进 HTML 转义链）
            if (role === 'assistant' && content) {
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                const ttsBtn = document.createElement('button');
                ttsBtn.type = 'button';
                ttsBtn.className = 'icon-btn';
                ttsBtn.textContent = '▶ 朗读';
                ttsBtn.onclick = () => playTTS(ttsBtn, content);
                actions.appendChild(ttsBtn);
                wrap.appendChild(actions);
            }

            row.appendChild(avatar);
            row.appendChild(wrap);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        function showTyping() {
            if (chatContainer.querySelector('.empty-state')) chatContainer.innerHTML = '';
            const row = document.createElement('div');
            row.className = 'msg-row assistant';
            row.id = 'typing-row';
            row.innerHTML =
                '<div class="avatar ai">✦</div>' +
                '<div class="bubble-wrap"><div class="bubble">' +
                '<span class="typing"><i></i><i></i><i></i></span></div></div>';
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function removeTyping() {
            const t = document.getElementById('typing-row');
            if (t) t.remove();
        }

        function clearMessages() { chatContainer.innerHTML = ''; }

        // ---------- 会话列表 ----------
        function renderSessionList() {
            sessionList.innerHTML = '';
            for (let id in sessions) {
                const li = document.createElement('div');
                li.className = 'session-item' + (id === currentSessionId ? ' active' : '');
                li.textContent = sessions[id].name || `会话 ${id}`;
                li.onclick = () => switchSession(id);
                sessionList.appendChild(li);
            }
        }

        async function switchSession(id) {
            currentSessionId = String(id); tempSession = false; clearMessages();
            chatTitle.textContent = sessions[id].name || `会话 ${id}`;
            if (!sessions[id].messages || sessions[id].messages.length === 0) {
                try {
                    const res = await fetch('/chat/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: currentSessionId }) });
                    const data = await res.json();
                    if (data.success && Array.isArray(data.history)) {
                        sessions[id].messages = [];
                        data.history.forEach(item => { sessions[id].messages.push({ role: item.is_user ? 'user' : 'assistant', content: item.content }); });
                    }
                } catch (err) { console.error('获取历史失败', err); }
            }
            if (!sessions[id].messages || sessions[id].messages.length === 0) {
                showEmptyState();
            } else {
                sessions[id].messages.forEach(m => appendMessage(m.role, m.content));
            }
            renderSessionList();
        }

        newChatBtn.addEventListener('click', () => {
            currentSessionId = 'temp';
            tempSession = true;
            clearMessages();
            chatTitle.textContent = '新对话';
            showEmptyState();
            renderSessionList();
            questionInput.focus();
        });

        // ---------- 流式发送（SSE）----------
        // 统一走 /chat/send-stream：支持流式的模型（通义/DeepSeek）逐帧渲染，
        // RAG/MCP 在服务端退化为一次性全量回调，前端协议保持一致
        async function streamSend(question) {
            if (chatContainer.querySelector('.empty-state')) chatContainer.innerHTML = '';

            // 先建一个空的 AI 气泡，增量填充
            const row = document.createElement('div');
            row.className = 'msg-row assistant';
            const avatar = document.createElement('div');
            avatar.className = 'avatar ai';
            avatar.textContent = '✦';
            const wrap = document.createElement('div');
            wrap.className = 'bubble-wrap';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
            wrap.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(wrap);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const finalize = (text) => {
                if (String(text).startsWith('[错误]')) bubble.classList.add('err');
                bubble.innerHTML = renderMarkdown(text);
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                const ttsBtn = document.createElement('button');
                ttsBtn.type = 'button';
                ttsBtn.className = 'icon-btn';
                ttsBtn.textContent = '▶ 朗读';
                ttsBtn.onclick = () => playTTS(ttsBtn, text);
                actions.appendChild(ttsBtn);
                wrap.appendChild(actions);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return text;
            };

            const payload = { question, modelType: modelTypeSelect.value };
            if (!tempSession && currentSessionId) payload.sessionId = currentSessionId;

            let full = '', sid = null, streamErr = null;
            try {
                const response = await fetch('/chat/send-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const ct = response.headers.get('content-type') || '';
                if (!response.ok || !ct.includes('text/event-stream')) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.message || ('HTTP ' + response.status));
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buf = '';
                let frameDone = false;
                while (!frameDone) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buf.indexOf('\n\n')) !== -1) {
                        const frame = buf.slice(0, idx);
                        buf = buf.slice(idx + 2);
                        if (!frame.startsWith('data:')) continue;
                        const data = frame.slice(5).trim();
                        if (data === '[DONE]') { frameDone = true; continue; }
                        let ev;
                        try { ev = JSON.parse(data); } catch (e) { continue; }
                        if (ev.sessionId) {
                            sid = String(ev.sessionId);
                        }
                        else if (ev.delta) {
                            full += ev.delta;
                            bubble.textContent = full;
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                        else if (ev.error) {
                            streamErr = ev.error;
                        }
                    }
                }
            }
            catch (err) {
                console.error(err);
                streamErr = '无法连接到服务器';
            }

            if (streamErr) full = '[错误] ' + streamErr;
            if (!full) full = '[错误] 模型返回为空';
            finalize(full);

            // 会话登记（与旧路径一致）
            if (sid) {
                sessions[sid] = {
                    name: question.slice(0, 12) || '新会话',
                    messages: [
                        { role: 'user', content: question },
                        { role: 'assistant', content: full }
                    ]
                };
                currentSessionId = sid;
                tempSession = false;
                chatTitle.textContent = sessions[sid].name;
                renderSessionList();
            }
            else if (!tempSession && currentSessionId && sessions[currentSessionId]) {
                sessions[currentSessionId].messages.push({ role: 'user', content: question });
                sessions[currentSessionId].messages.push({ role: 'assistant', content: full });
            }
        }

        // ---------- 发送 ----------
        function setSending(on) {
            sending = on;
            sendBtn.disabled = on;
            sendBtn.innerHTML = on ? '<span class="spinner"></span>' : '发送';
        }

        chatForm.addEventListener('submit', async e => {
            e.preventDefault();
            if (sending) return;                 // 请求在途时禁止重复提交
            const question = questionInput.value.trim();
            if (!question) return;

            appendMessage('user', question);
            setSending(true);
            questionInput.value = '';
            questionInput.style.height = 'auto';

            // 统一走流式端点：打字指示即流式气泡的初始状态
            await streamSend(question);
            setSending(false);
            questionInput.focus();
        });

        // —— 旧的非流式路径保留备用（API 兼容），当前统一走 streamSend ——
        async function legacySend(question) {
            showTyping();
            try {
                if (tempSession) {
                    const response = await fetch('/chat/send-new-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question, modelType: modelTypeSelect.value })
                    });
                    const data = await response.json();
                    removeTyping();
                    if (data.success) {
                        const sessionId = String(data.sessionId);
                        sessions[sessionId] = {
                            name: question.slice(0, 12) || '新会话',
                            messages: [
                                { role: 'user', content: question },
                                { role: 'assistant', content: data.Information }
                            ]
                        };
                        currentSessionId = sessionId;
                        tempSession = false;
                        chatTitle.textContent = sessions[sessionId].name;
                        appendMessage('assistant', data.Information);
                    } else {
                        appendMessage('assistant', '[错误] ' + (data.message || '未知错误'));
                    }
                } else {
                    const response = await fetch('/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question, modelType: modelTypeSelect.value, sessionId: currentSessionId })
                    });
                    const data = await response.json();
                    removeTyping();
                    if (data.success) {
                        appendMessage('assistant', data.Information);
                        sessions[currentSessionId].messages.push({ role: 'user', content: question });
                        sessions[currentSessionId].messages.push({ role: 'assistant', content: data.Information });
                    } else {
                        appendMessage('assistant', '[错误] ' + (data.message || '未知错误'));
                    }
                }
            } catch (err) {
                console.error(err);
                removeTyping();
                appendMessage('assistant', '[错误] 无法连接到服务器');
            } finally {
                // 无论成功失败都恢复输入状态，绝不能把发送按钮卡死在 loading
                setSending(false);
                questionInput.focus();
            }
        }

        // Enter 发送 / Shift+Enter 换行；输入框自动增高
        questionInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });
        questionInput.addEventListener('input', () => {
            questionInput.style.height = 'auto';
            questionInput.style.height = Math.min(questionInput.scrollHeight, 160) + 'px';
        });

        // ---------- 同步历史 ----------
        syncBtn.addEventListener('click', async () => {
            if (!currentSessionId || tempSession) {
                cppaiToast('请选择已有会话进行同步', 'info');
                return;
            }
            try {
                const res = await fetch('/chat/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: currentSessionId })
                });
                const data = await res.json();
                if (data.success && Array.isArray(data.history)) {
                    sessions[currentSessionId].messages = [];
                    clearMessages();
                    if (data.history.length === 0) { showEmptyState(); return; }
                    data.history.forEach(item => {
                        appendMessage(item.is_user ? 'user' : 'assistant', item.content);
                        sessions[currentSessionId].messages.push({ role: item.is_user ? 'user' : 'assistant', content: item.content });
                    });
                    cppaiToast('历史已同步', 'ok');
                } else {
                    cppaiToast('无法获取历史数据', 'err');
                }
            } catch (err) {
                console.error(err);
                cppaiToast('请求历史数据失败', 'err');
            }
        });

        // ---------- 会话加载 ----------
        async function loadSessions() {
            try {
                const res = await fetch('/chat/sessions');
                const data = await res.json();
                if (data.success && Array.isArray(data.sessions)) {
                    data.sessions.forEach(s => {
                        const sid = String(s.sessionId);
                        sessions[sid] = { name: s.name || `会话 ${sid}`, messages: [] };
                    });
                    renderSessionList();
                }
            } catch (err) {
                console.error('获取会话列表失败', err);
            }
            showEmptyState();
        }

        loadSessions();
    </script>
</body>
</html>
